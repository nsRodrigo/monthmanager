name: Deploy

on:
  push:
    branches:
      - main
      - develop

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Versão exibida no app (login, bloqueio biométrico, Home) — major.minor
      # vêm do package.json (bump manual quando quiser marcar um marco), o
      # terceiro número é o run_number do Actions, que sobe sozinho a cada
      # push. Assim dá pra ver na hora se o deploy que chegou no celular é
      # o mais recente ou um antigo em cache.
      - name: Compute app version
        id: version
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "value=${BASE}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_APP_VERSION: ${{ steps.version.outputs.value }}

      - name: Deploy to Cloudflare Workers (production)
        if: github.ref == 'refs/heads/main'
        run: npx wrangler deploy --name app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Workers (staging)
        if: github.ref == 'refs/heads/develop'
        run: npx wrangler deploy --name app-develop
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
